{{define "lookup.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cantoboon — {{.Query}}</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <main>
    <h1><a href="/">Cantoboon</a></h1>
    <form action="/lookup" method="get">
      <input type="text" name="q" value="{{.Query}}" autofocus>
      <button type="submit">Search</button>
    </form>
    {{if .Entries}}
      <ul>
        {{range .Entries}}
          <li>
            <strong>{{.Traditional}}</strong>
            {{if ne .Traditional .Simplified}}({{.Simplified}}){{end}}
            — {{.Jyutping}}
          </li>
        {{end}}
      </ul>
    {{else}}
      <p>No exact matches for "{{.Query}}".</p>
    {{end}}
  </main>
</body>
</html>
{{end}}
